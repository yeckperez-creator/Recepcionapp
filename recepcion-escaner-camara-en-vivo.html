<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Recepción con escáner (cámara en vivo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#0b6bcb;--ok:#127a3d;--okb:#e3f5ea;--bad:#b42318;--badb:#fdecea;--wr:#9a6700;--wrb:#fff4d6;--bd:#dfe3e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#1a2027;--tx:#e8ecf0;--mu:#9aa5b1;--ac:#5aa9ff;--ok:#5fd18a;--okb:#16301f;--bad:#ff8a80;--badb:#3a1c19;--wr:#f2c14e;--wrb:#3a3014;--bd:#2c3540;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--card:#1a2027;--tx:#e8ecf0;--mu:#9aa5b1;--ac:#5aa9ff;--ok:#5fd18a;--okb:#16301f;--bad:#ff8a80;--badb:#3a1c19;--wr:#f2c14e;--wrb:#3a3014;--bd:#2c3540;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
select,input[type=number],input[type=text],input[type=file]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
:root[data-theme="dark"] button,:root:not([data-theme="light"]) button{color:#0b1220}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
video{width:100%;max-height:220px;object-fit:cover;border-radius:10px;background:#000;display:block}
#msg{margin:8px 0 0;padding:9px 11px;border-radius:8px;font-weight:600;display:none}
#msg.ok{display:block;background:var(--okb);color:var(--ok)}
#msg.bad{display:block;background:var(--badb);color:var(--bad)}
#msg.wr{display:block;background:var(--wrb);color:var(--wr)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar>div{height:100%;background:var(--ok);width:0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:8px;font-size:14px}
.tabs button:not(.on){background:transparent;color:var(--mu);border:1px solid var(--bd)}
.it{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;background:var(--card)}
.it.done{background:var(--okb);border-color:var(--ok)}
.it.over{background:var(--wrb);border-color:var(--wr)}
.it.last{outline:2px solid var(--ac)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:var(--ok)}
.done .chk{border-color:var(--ok)}
.inf{flex:1;min-width:0}
.inf b{display:block;overflow-wrap:anywhere}
.inf small{color:var(--mu)}
.cnt{display:flex;align-items:center;gap:6px;flex:none}
.cnt button{padding:4px 10px;font-size:18px}
.cnt span{min-width:44px;text-align:center;font-weight:700}
.hide{display:none!important}
.mu{color:var(--mu);font-size:13px}
</style></head>
<body>
<h1>📦 Recepción con escáner</h1>

<div id="s1" class="card">
  <label>1. Sube tu hoja de recepción (Excel o CSV)</label>
  <input type="file" id="f">
  <div id="resume" class="hide" style="margin-top:10px"><button class="sec" id="bResume" style="width:100%">Continuar la recepción guardada</button></div>
  <div id="map" class="hide">
    <label>Fila donde están los encabezados</label>
    <input type="number" id="hr" value="1" min="1">
    <label>Columna del código de barras / código del producto</label><select id="cC"></select>
    <label>Columna de la descripción</label><select id="cD"></select>
    <label>Columna de cantidad esperada (cajas/bultos). Si no hay, cada escaneo marca la línea</label><select id="cQ"></select>
    <button id="bGo" style="width:100%;margin-top:12px">Empezar recepción</button>
  </div>
</div>

<div id="s2" class="hide">
  <div class="card">
    <video id="v" playsinline muted class="hide"></video>
    <div class="row" style="margin-top:8px">
      <button id="bCam">📷 Abrir cámara</button>
      <button id="bNew" class="sec">Otra hoja</button></div><div class="row" style="margin-top:8px"><button id="bPhoto">📸 Escanear con foto</button><input type="file" id="ph" accept="image/*" capture="environment" class="hide">
    </div>
    <label>O escribe o pega el código</label>
    <input type="text" id="man" inputmode="numeric" placeholder="Código y Enter">
    <div id="msg"></div>
  </div>
  <div class="card">
    <div id="prog"><b></b></div>
    <div class="bar"><div id="pb"></div></div>
    <div class="tabs"><button data-f="all" class="on">Todos</button><button data-f="pend">Pendientes</button><button data-f="done">Listos</button></div>
    <div id="list"></div>
    <div id="extras" class="hide"><p class="mu" style="margin-top:14px"><b>Escaneados que no están en la hoja:</b></p><div id="exl"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),KEY='recepcion-escaner-v1';
let rows=[],items=[],extras=[],filt='all',lastIdx=-1,stream=null,det=null,loop=false,lastCode='',lastT=0,zx=null;
const norm=s=>String(s==null?'':s).replace(/[^0-9A-Za-z]/g,'').toUpperCase().replace(/^0+/,'');
function save(){try{localStorage.setItem(KEY,JSON.stringify({items,extras}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');return d&&d.items&&d.items.length?d:null}catch(e){return null}}
if(load())$('#resume').classList.remove('hide');
$('#bResume').onclick=()=>{const d=load();items=d.items;extras=d.extras||[];openS2()};

$('#f').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    $('#map').classList.remove('hide');fillSel();
  }catch(err){alert('No pude leer el archivo. Prueba guardándolo como .xlsx o .csv')}
};
$('#hr').oninput=fillSel;
function fillSel(){
  const h=rows[Math.max(0,(+$('#hr').value||1)-1)]||[];
  const opt=h.map((x,i)=>'<option value="'+i+'">'+(String(x).trim()||'Columna '+(i+1))+'</option>').join('');
  $('#cC').innerHTML=opt;$('#cD').innerHTML=opt;$('#cQ').innerHTML='<option value="-1">— ninguna —</option>'+opt;
  const g=(re,def)=>{const i=h.findIndex(x=>re.test(String(x)));return i>=0?i:def};
  $('#cC').value=g(/c[oó]d|barra|ean|upc|sku/i,0);
  $('#cD').value=g(/desc|prod|nombre|art/i,Math.min(1,h.length-1));
  $('#cQ').value=g(/cant|caja|bulto|unid|qty/i,-1);
}
$('#bGo').onclick=()=>{
  const hr=(+$('#hr').value||1)-1,c=+$('#cC').value,d=+$('#cD').value,q=+$('#cQ').value;
  items=rows.slice(hr+1).filter(r=>norm(r[c])).map(r=>({code:String(r[c]).trim(),n:norm(r[c]),desc:String(r[d]||'').trim(),exp:q>=0?(parseFloat(String(r[q]).replace(',','.'))||1):1,got:0}));
  if(!items.length){alert('No encontré códigos en esa columna. Revisa la fila de encabezados y la columna.');return}
  extras=[];lastIdx=-1;save();openS2();
};
function openS2(){$('#s1').classList.add('hide');$('#s2').classList.remove('hide');render();startCam()}
$('#bNew').onclick=()=>{if(!confirm('¿Cargar otra hoja? Se perderá el avance guardado.'))return;stopCam();try{localStorage.removeItem(KEY)}catch(e){};location.reload()};

function render(){
  const done=items.filter(i=>i.got>=i.exp).length;
  $('#prog b').textContent=done+' de '+items.length+' líneas completas';
  $('#pb').style.width=(items.length?done/items.length*100:0)+'%';
  const h=items.map((it,i)=>({it,i})).filter(({it})=>filt==='all'||(filt==='done'?it.got>=it.exp:it.got<it.exp)).map(({it,i})=>{
    const cl=it.got>it.exp?'over':it.got>=it.exp?'done':'';
    return '<div class="it '+cl+(i===lastIdx?' last':'')+'" id="r'+i+'"><div class="chk">'+(it.got>=it.exp?'✔':'')+'</div><div class="inf"><b>'+esc(it.desc||it.code)+'</b><small>'+esc(it.code)+'</small></div><div class="cnt"><button class="sec" data-a="-" data-i="'+i+'">−</button><span>'+it.got+'/'+it.exp+'</span><button class="sec" data-a="+" data-i="'+i+'">+</button></div></div>';
  }).join('');
  $('#list').innerHTML=h||'<p class="mu">Nada por aquí.</p>';
  $('#extras').classList.toggle('hide',!extras.length);
  $('#exl').innerHTML=extras.map(x=>'<div class="it"><div class="inf"><b>'+esc(x.c)+'</b></div><span>×'+x.n+'</span></div>').join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const it=items[+b.dataset.i];it.got=Math.max(0,it.got+(b.dataset.a==='+'?1:-1));lastIdx=+b.dataset.i;save();render()};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.f;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()};

function say(t,c){const m=$('#msg');m.textContent=t;m.className=c}
let ac=null;
function beep(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}try{navigator.vibrate&&navigator.vibrate(f>600?60:[80,60,80])}catch(e){}}
function handle(code){
  const now=Date.now();if(code===lastCode&&now-lastT<1500)return;lastCode=code;lastT=now;
  const n=norm(code),i=items.findIndex(x=>x.n===n);
  if(i<0){const x=extras.find(y=>y.c===code);x?x.n++:extras.push({c:code,n:1});beep(300);say('No está en la hoja: '+code,'bad')}
  else{const it=items[i];it.got++;lastIdx=i;
    if(it.got>it.exp){beep(300);say('¡Sobra! '+(it.desc||it.code)+' ('+it.got+'/'+it.exp+')','wr')}
    else{beep(880);say('✔ '+(it.desc||it.code)+' ('+it.got+'/'+it.exp+')','ok')}}
  save();render();
  const el=document.getElementById('r'+lastIdx);if(el&&filt==='all')el.scrollIntoView({block:'nearest'});
}
$('#man').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){handle(e.target.value.trim());e.target.value=''}};

$('#bCam').onclick=()=>stream||zx?stopCam():startCam();
$('#bPhoto').onclick=()=>$('#ph').click();
$('#ph').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  say('Leyendo foto…','wr');
  try{
    let codes=[];
    if('BarcodeDetector' in window){const bm=await createImageBitmap(f);codes=(await new BarcodeDetector().detect(bm)).map(r=>r.rawValue)}
    else{await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
      const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(URL.createObjectURL(f));codes=[r.getText()]}
    if(!codes.length){say('No detecté ningún código. Acerca más la cámara y cuida que salga enfocado.','bad');return}
    [...new Set(codes)].forEach(c=>{lastT=0;handle(c)});
  }catch(err){say('No detecté ningún código en la foto. Intenta de nuevo más cerca y con buena luz.','bad')}
};
async function startCam(){
  const v=$('#v');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    v.srcObject=stream;v.classList.remove('hide');await v.play();$('#bCam').textContent='⏹ Cerrar cámara';
    if('BarcodeDetector' in window){det=new BarcodeDetector();loop=true;tick()}
    else{stopStream();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
      s.onload=()=>{zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoDevice(null,'v',r=>{if(r)handle(r.getText())})};document.head.appendChild(s)}
  }catch(e){say('La cámara en vivo está bloqueada aquí ('+(e&&e.name||'error')+'). Usa el botón 📸 Escanear con foto o escribe el código.','bad')}
}
async function tick(){if(!loop)return;try{const r=await det.detect($('#v'));if(r.length)handle(r[0].rawValue)}catch(e){}setTimeout(tick,150)}
function stopStream(){loop=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function stopCam(){stopStream();if(zx){try{zx.reset()}catch(e){}zx=null}$('#v').classList.add('hide');$('#bCam').textContent='📷 Abrir cámara'}
</script>
</body></html>
